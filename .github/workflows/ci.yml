# CI for the agent-workflow kit — runs the full regression suite.
# Zero-dependency promise (ADR-0002) means no install step: just run unittest.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the ai-workflow test suite
        run: python -m unittest discover -s tests -v
        working-directory: scripts/ai-workflow
